[package]
name = "synapsectl"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "The `synapse` command line: a plain adapter for any agent or person (M2: identity; M5b: mail over synapsed, through `synapsed-client`)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/synapse"
readme = "README.md"

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
synapse = { path = "../..", version = "6.0.0-rc.125" }
synapse-security = { path = "../synapse-security", version = "6.0.0-rc.125" }
synapsed-client = { path = "../synapsed-client", version = "6.0.0-rc.125" }
clap = { version = "4.5.41", features = ["derive", "env"] }
chrono = "0.4"
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
synapse-mailbox-persistant = { path = "../synapse-mailbox-persistant", version = "6.0.0-rc.125", optional = true }

[features]
# `synapse storage list` / `use`: the stores PersistAnt can offer for the mailbox, and recording the
# operator's pick. On by default; `--no-default-features` drops PersistAnt from the CLI.
default = ["storage"]
storage = ["dep:synapse-mailbox-persistant"]

[dev-dependencies]
tempfile = "3.0"
serde_json = "1.0"
