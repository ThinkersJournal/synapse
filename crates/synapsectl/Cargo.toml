[package]
name = "synapsectl"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "The `synapse` command line: a plain adapter for any agent or person (M2: identity; M5b: mail over synapsed, through `synapsed-client`)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/synapse"
readme = "README.md"

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
synapse = { path = "../..", version = "6.0.0-rc.111" }
synapse-security = { path = "../synapse-security", version = "6.0.0-rc.111" }
synapsed-client = { path = "../synapsed-client", version = "6.0.0-rc.111" }
clap = { version = "4.5.41", features = ["derive", "env"] }
chrono = "0.4"
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tempfile = "3.0"
serde_json = "1.0"
