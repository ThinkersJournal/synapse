[package]
name = "synapsed-client"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "The blocking client for `synapsed` (find the daemon, prove it, claim a role, keep one session), shared by the CLI and the MCP adapters. No MCP, no CLI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/synapse"
readme = "README.md"

[dependencies]
synapse = { path = "../..", version = "6.0.0-rc.196", default-features = false, features = ["native-base"] }
synapse-security = { path = "../synapse-security", version = "6.0.0-rc.196" }
chrono = "0.4"
# Loopback HTTP only: no TLS stack and no system proxy (board 104: no new non-Rust deps).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
ring = "0.17"

[target.'cfg(unix)'.dependencies]
# Only for `setsid` when auto-starting the daemon, `flock` for the role lock, and `kill(pid, 0)` to
# check that an announced daemon is alive.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Only to stop the auto-started daemon inheriting this process's stdio handles, `LockFileEx` for the
# role lock, and checking that an announced daemon is alive.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.0"
