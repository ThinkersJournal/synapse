[package]
name = "synapse-mailbox-persistant"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "A Synapse MailStore over PersistAnt's key-value kind; SQLite opened for power-loss durability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/synapse"

[dependencies]
synapse = { path = "../..", version = "6.0.0-rc.136" }
persistant-kv = "0.9.4"
persistant-sqlx = { version = "0.9.4", features = ["sqlite"] }
persistant = { version = "0.9.10", features = ["registry-sqlite", "registry-postgres", "registry-mysql"] }
tokio = { version = "1.46.1", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
synapse = { path = "../..", version = "6.0.0-rc.136", features = ["mailbox-conformance", "mailbox-redb"] }
tempfile = "3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.46.1", features = ["rt-multi-thread", "time", "macros"] }

[[bench]]
name = "mailbox_cost"
harness = false

[[example]]
name = "mailbox_vm"
