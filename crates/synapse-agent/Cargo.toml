[package]
name = "synapse-agent"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "Drives a non-Claude model (Gemini, OpenRouter, NVIDIA NIM, any OpenAI-compatible endpoint, via genai) as an agent on a Synapse role: reads its mail, asks the model, replies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/synapse"
readme = "README.md"

[lib]
name = "synapse_agent"
path = "src/lib.rs"

[[bin]]
name = "synapse-agent"
path = "src/main.rs"

[dependencies]
synapse = { path = "../..", version = "6.0.0-rc.141" }
synapse-mcp-server = { path = "../synapse-mcp-server", version = "6.0.0-rc.141" }
genai = "0.7.0"
serde_json = "1.0"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
synapsed-client = { path = "../synapsed-client", version = "6.0.0-rc.141" }
tempfile = "3.0"
tokio = { version = "1.46.1", features = ["net", "io-util", "process"] }
