[package]
name = "synapse-mcp-server"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "Generic MCP stdio adapter over synapsed: lets any MCP client send, fetch, ack, list, set a summary and ask whoami as one role."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/synapse"
readme = "README.md"

[lib]
name = "synapse_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "synapse-mcp"
path = "src/main.rs"

[dependencies]
synapse = { path = "../..", version = "6.0.0-rc.146" }
synapsed-client = { path = "../synapsed-client", version = "6.0.0-rc.146" }
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "sync", "io-std", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
rmcp = { version = "3.4.0", features = ["client", "transport-child-process"] }
tokio = { version = "1.46.1", features = ["process"] }
tempfile = "3.0"
base64 = "0.23"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
