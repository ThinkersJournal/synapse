#
# One Synapse daemon with a persistent home.
#
# `synapsed` listens on loopback only and refuses any other address, so this service publishes NO
# port: it is reached from inside the container with `docker compose exec`. Mailbox, keys and the
# announce file live in the `synapse-home` volume.
#
# First run (the daemon refuses to start until an account exists):
#
#   docker compose run --rm synapse synapse id init --account me
#   docker compose up -d
#   docker compose exec synapse synapse claim --role alice
#   docker compose exec synapse synapse send --role alice --to alice "hello"
#   docker compose exec synapse synapse inbox --role alice
#
# Pin a release instead of the moving `main` tag with SYNAPSE_IMAGE=ghcr.io/thinkersjournal/synapse:<tag>.

services:
  synapse:
    image: ${SYNAPSE_IMAGE:-ghcr.io/thinkersjournal/synapse:main}
    container_name: synapse
    restart: unless-stopped
    environment:
      - SYNAPSE_HOME=/home/synapse/.local/share/synapse
    volumes:
      - synapse-home:/home/synapse/.local/share/synapse

volumes:
  synapse-home:
