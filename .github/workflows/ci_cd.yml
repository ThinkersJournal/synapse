name: Synapse CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

# Least privilege (zizmor `excessive-permissions`, CodeRipper SUP-008): the token reads the repo and nothing else.
# No job below needs more: Docker Hub and the deploy hosts authenticate with secrets, not the GITHUB_TOKEN.
# Raise per job, never here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A licence-header ratchet. The sweep that put headers on this crate is a
  # one-off; this is the part that lasts.
  #
  # A SWEEP DOES NOT FIX A PROPERTY THAT REGROWS: `fuel` stamped 795 files on
  # 2026-08-19 and had drifted to 823/833 by 2026-09-10 - nothing was undone,
  # ten files were added afterwards and nothing was watching.
  #
  # A SEPARATE JOB RATHER THAN A STEP IN `build`, DELIBERATELY. `build` stands
  # up a Rust toolchain before it does anything; a job
  # that dies in an earlier step asserts nothing about the steps below it while
  # its name goes on claiming otherwise. This needs neither, runs in seconds,
  # and stays informative on a run where the toolchain or the service fails.
  #
  # Verified against the DEFECT rather than against the fix, on the swept tree:
  #
  #   a tracked .rs file with no header       -> exit 1, names the file
  #   a file declaring a different licence    -> exit 1, refuses to rewrite it
  #   a file declaring `Apache-2.0 OR MIT`    -> exit 0, the SAME grant
  #   an EMPTY file                           -> exit 0, nothing to license
  #   the extension glob matching nothing     -> exit 1, NOT 100% of zero
  spdx:
    name: Every source file declares the licence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gate's own controls run FIRST. A checker nobody has watched fail is
      # a checker nobody has evidence works, and a gate whose parser silently
      # broke would report a clean tree rather than an error.
      - name: Self-test the SPDX gate
        run: python3 .github/spdx_gate.py --self-test

      - name: Every tracked source file declares the licence
        run: python3 .github/spdx_gate.py

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Cache Cargo dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config libpq-dev protobuf-compiler
    
    - name: Install stable toolchain
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: stable
        profile: minimal
        override: true
        components: clippy, rustfmt
    
    # Order and `if: always()` are deliberate.
    #
    # This job used to run fmt -> clippy -> build -> test with every step
    # short-circuiting the next, and across its first 24 pipeline runs the
    # first-failing step was `Check formatting` 17 times and `Clippy` 6 times.
    # `Build` and `Run tests` were therefore skipped on 23 of 24 runs.
    #
    # The cost was not only that the build went unverified. A gate that is red
    # on every run cannot announce a regression: PR #11 landed an unformatted
    # file, its own run reported `Check formatting -> FAILURE`, and that was
    # indistinguishable from the seventeen runs where the same step failed for
    # reasons nobody could act on. It was merged, and blocked CI for 5 commits.
    #
    # So: `Build` and `Run tests` run first, and `if: always()` makes every
    # step run and report on every run. A failing step still fails the job --
    # this is deliberately not `continue-on-error`, which would let the job go
    # green while style was broken.
    #
    # Trade, stated because it is one: a trivial formatting break now waits for
    # a full build before it is reported.

    - name: Build
      run: cargo build --locked --workspace --verbose

    - name: Run tests
      if: always()
      # --no-fail-fast: without it cargo stops at the first failing test binary, and
      # every target that sorts after it (including all doc-tests) never runs here.
      # --workspace: a root package with members tests only itself by default, which would
      # silently drop crates/synapse-mcp-server's tests.
      run: cargo test --locked --workspace --verbose --no-fail-fast

    - name: Check formatting
      if: always()
      run: cargo fmt --all -- --check

    - name: Clippy
      if: always()
      # --all-targets: without it clippy lints only the lib and bins, never
      # #[cfg(test)] code, tests/, examples/ or benches/ (issue #53). Under the
      # default `native` feature set this reaches every target except those that
      # are known not to compile: the two `test = false` integration tests
      # (see Cargo.toml).
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # CIRESNAVE-EXPECTATIONS 5.1d, verbatim: "Make sure Synapse isn't building things
  # claude-specific because it is a communication system for *any LLM*." The core crate
  # must build and pass with NO adapter crate present, and must not depend on rmcp.
  # Each check pairs with a positive control so a broken query cannot pass by finding nothing.
  # cargo REJECTS members = ["crates/*"] when crates/ is absent or empty (measured
  # 2026-09-30), so the core-only build rewrites members to [] and asserts the rewrite.
  model-agnostic-core:
    name: core is model-agnostic
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config libpq-dev protobuf-compiler

    - name: Install stable toolchain
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Positive control -- the MCP adapter does depend on rmcp
      run: |
        set -o pipefail
        n=$(cargo tree --locked -p synapse-mcp-server -e normal --prefix none | { grep -c '^rmcp ' || true; })
        echo "rmcp lines in synapse-mcp-server's tree: $n"
        test "$n" -ge 1

    - name: The core's dependency tree has no rmcp (all features)
      run: |
        set -o pipefail
        n=$(cargo tree --locked -p synapse --all-features -e normal,build --prefix none | { grep -c '^rmcp ' || true; })
        echo "rmcp lines in synapse's tree: $n"
        test "$n" -eq 0

    - name: Remove every adapter crate
      run: |
        set -o pipefail
        rm -rf crates/
        test ! -e crates
        sed -i 's/^members = \["crates\/\*"\]\(\r\?\)$/members = []\1/' Cargo.toml
        test "$(grep -cE '^members = \[\]'$'\r''?$' Cargo.toml)" -eq 1

    # Not --locked: the step above deletes crates/ and empties `members`, so the resolved graph
    # legitimately differs from the committed Cargo.lock (it loses the adapters' entries).
    - name: The core builds and passes with no adapter present
      run: cargo test -p synapse --verbose --no-fail-fast

  # COVERAGE IS A SIGNAL, NOT A GATE (agreed with CireSnave 2026-10-03; a pilot with
  # mlmf and coderipper). This job is NOT a required check, sets no threshold, and
  # codecov.yml makes Codecov's own statuses informational. A separate job, not a
  # step of `build`, so that `Build and Test` is untouched and an instrumentation
  # problem here can never be mistaken for a build or test failure there.
  #
  # WHAT THE NUMBER COVERS: lines and regions of the workspace crates executed by
  # `cargo test --workspace` under the DEFAULT features (`native`), on ubuntu,
  # including code run in child processes the tests spawn from this build's own
  # instrumented binaries (the `synapse` CLI and `synapsed`).
  #
  # WHAT IT DOES NOT COVER, so a high number must not be read as these:
  #   - non-default features (`jwt`, wasm, ...);
  #   - `cfg(windows)` code: the Windows ACL check, LockFileEx, the daemon's
  #     Windows spawn flags. It is never compiled here;
  #   - doc-tests (stable cargo-llvm-cov does not run them);
  #   - whether any executed line was ASSERTED on. Coverage counts execution,
  #     not checking.
  #
  # The test run here is `--no-fail-fast` and its result is reported, but
  # `Build and Test` remains the test gate: a red here with a green there means
  # instrumentation, not a regression.
  coverage:
    name: Coverage (signal, not a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache Cargo dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # A key of its own: instrumented artifacts must not mix with `build`'s.
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-cov-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config libpq-dev protobuf-compiler

    - name: Install stable toolchain
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: stable
        profile: minimal
        override: true
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@32e16a23c68a001a1621efca19f131f965d4d122 # cargo-llvm-cov

    - name: Run the tests under instrumentation
      run: cargo llvm-cov --locked --workspace --no-fail-fast --no-report

    # The reports are built from the run above even if a test failed, so a
    # failure there still leaves a number, and the job still goes red.
    #
    # `report` has no --workspace, and with no -p it selects the ROOT package only
    # (cargo's default for a root package with members), so it silently drops every
    # file under crates/: measured on this PR's first run, 77 files, 0 from crates/,
    # while the synapsed and synapsectl tests had run. Every member is therefore
    # named, taken from cargo metadata rather than a hand-written list.
    - name: Select every workspace member for the reports
      if: always()
      run: |
        set -o pipefail
        pkgs=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].name' | sed 's/^/-p /' | tr '\n' ' ')
        echo "members: $pkgs"
        test -n "$pkgs"
        echo "COV_PKGS=$pkgs" >> "$GITHUB_ENV"

    - name: Coverage summary
      if: always()
      run: cargo llvm-cov report --summary-only $COV_PKGS

    - name: Write lcov
      if: always()
      run: cargo llvm-cov report --lcov --output-path lcov.info $COV_PKGS

    # Positive control for the trap above: each member with a src/ directory must
    # contribute files to the report. A member with no executed code would still
    # appear (with zero hits), so absence means it was never selected.
    - name: Every workspace member is in the report
      if: always()
      run: |
        set -o pipefail
        missing=0
        for dir in $(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].manifest_path' | xargs -n1 dirname); do
          n=$(grep -c "^SF:$dir/src/" lcov.info || true)
          echo "$n files from $dir/src"
          if [ "$n" -eq 0 ]; then missing=1; fi
        done
        test "$missing" -eq 0

    - name: Keep lcov as an artifact
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lcov
        path: lcov.info
        if-no-files-found: error

    # No repository secret in any pull-request job (CireSnave 2026-10-22: "Don't give pull-request-triggered
    # jobs on a public repo any repository secrets."). A pull request uploads tokenless; the job that holds
    # CODECOV_TOKEN is `coverage-upload` below and never runs for one.
    - name: Upload to Codecov (pull request, tokenless)
      if: always() && github.event_name == 'pull_request'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: lcov.info
        disable_search: true
        # Tokenless uploads are accepted only for some pull requests; a refusal must not turn a signal red.
        fail_ci_if_error: false

  coverage-upload:
    name: Coverage upload (push only)
    runs-on: ubuntu-latest
    needs: coverage
    if: always() && github.event_name != 'pull_request' && needs.coverage.result == 'success'
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: lcov

    - name: Upload to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        disable_search: true
        # An upload that silently fails would leave a stale number on the
        # dashboard, which reads as a fresh one.
        fail_ci_if_error: true

  # THE SQLITE STORE (board 229) IS A SEPARATE, NON-REQUIRED JOB (PM ruling 2026-10-20): the daemon's
  # API suite takes ~10 minutes against SQLite (about 21 seconds against redb), and `sqlite-store` is
  # off by default, so no step of `build` compiles it. Not in branch protection; a red here is read
  # as a finding about the SQLite store, and `Build and Test` stays the gate for everything else.
  sqlite-store:
    name: SQLite store (signal, not a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache Cargo dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-sqlite-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-sqlite-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config libpq-dev protobuf-compiler

    - name: Install stable toolchain
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: stable
        profile: minimal
        override: true
        components: clippy

    - name: Clippy, sqlite-store
      if: always()
      run: cargo clippy --locked -p synapsed -p synapse-mailbox-persistant --features synapsed/sqlite-store --all-targets -- -D warnings

    - name: Adapter tests
      if: always()
      run: cargo test --locked -p synapse-mailbox-persistant --no-fail-fast

    - name: Daemon API suite against the SQLite store
      if: always()
      env:
        SYNAPSE_TEST_STORE: sqlite
      run: cargo test --locked -p synapsed --features sqlite-store --test api --no-fail-fast

    - name: Moving a redb mailbox to the SQLite store
      if: always()
      run: cargo test --locked -p synapsed --features sqlite-store --test migrate --no-fail-fast

  # PostgreSQL 16 mailbox store. A service container on a GitHub-hosted runner, as PersistAnt's own CI does it
  # (SUP-008 waiver reason, PM ruling 2026-10-14): CI-only container, no credential of ours reaches it
  # (the password below is throwaway and only this job's runner can reach the port), pinned by digest.
  # SYNAPSE_REQUIRE_DATABASE=1 makes a missing URL fail instead of skip: a skipped test must not look green.
  server-postgres:
    name: PostgreSQL 16 mailbox store (service container, signal, not a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_PASSWORD: synapse-test
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SYNAPSE_TEST_DATABASE_URL: postgres://postgres:synapse-test@localhost:5432/synapse
      SYNAPSE_REQUIRE_DATABASE: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

    - name: Install stable toolchain
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: The mailbox on the server (conformance suite, listing, one daemon per database)
      run: cargo test --locked -p synapse-mailbox-persistant --test servers --no-fail-fast

    - name: The lease (SQLite, no server needed)
      run: cargo test --locked -p synapse-mailbox-persistant --test lease --no-fail-fast

  # MySQL 8.4 mailbox store. A service container on a GitHub-hosted runner, as PersistAnt's own CI does it
  # (SUP-008 waiver reason, PM ruling 2026-10-14): CI-only container, no credential of ours reaches it
  # (the password below is throwaway and only this job's runner can reach the port), pinned by digest.
  # SYNAPSE_REQUIRE_MYSQL=1 makes a missing URL fail instead of skip: a skipped test must not look green.
  server-mysql:
    name: MySQL 8.4 mailbox store (service container, signal, not a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ROOT_PASSWORD: synapse-test
          MYSQL_DATABASE: synapse
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psynapse-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SYNAPSE_TEST_MYSQL_URL: mysql://root:synapse-test@127.0.0.1:3306/synapse
      SYNAPSE_REQUIRE_MYSQL: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

    - name: Install stable toolchain
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: The mailbox on the server (conformance suite, listing, one daemon per database)
      run: cargo test --locked -p synapse-mailbox-persistant --test servers --no-fail-fast

    - name: The lease (SQLite, no server needed)
      run: cargo test --locked -p synapse-mailbox-persistant --test lease --no-fail-fast

  # The WebAssembly package has its own job so that `Build and Test` can be a
  # required check. While it was a step of that job, it failed on every run with
  # `cd: wasm: No such file or directory` -- there is no `wasm/` directory in this
  # repository and there never has been (the only top-level wasm entries are
  # Cargo-wasm.toml, build-wasm.sh and build-wasm.bat). This job stays here as a
  # placeholder for the WASM slice, which is its own slice on the roadmap after
  # the 2.0.0 publish and will build a real `wasm/` package. Until then it is
  # `if: false` rather than left to fail: a permanently-red, non-required check
  # means `main`'s rollup is never green, so a genuinely new failure would be
  # indistinguishable from this expected one. `if: false` reports `skipped`
  # instead -- the same distinction this project already relies on for a
  # Sourcery skip not being a review. Remove `if: false` when the WASM slice
  # adds the real package.
  wasm:
    name: Build WebAssembly package
    runs-on: ubuntu-latest
    if: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      with:
        version: 'latest'

    - name: Build WebAssembly package
      run: |
        cd wasm
        wasm-pack build --target web

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      
      - name: Run security audit
        run: cargo audit

      - name: No crate in the workspace depends on rsa (RUSTSEC-2023-0071)
        # `rsa` left the tree in rc.89 (jsonwebtoken `aws_lc_rs`). `cargo audit` would
        # only notice if its ignore were still needed; this fails when anything
        # pulls `rsa` back in. Absence is `cargo tree` exiting non-zero with "did not
        # match any packages", so any other failure is not read as absence.
        shell: bash
        run: |
          set -u
          cargo tree --locked --workspace -i aws-lc-rs > /dev/null   # positive control: the query works
          for flags in "" "--all-features"; do
            if out=$(cargo tree --locked --workspace $flags -i rsa 2>&1); then
              echo "rsa is in the dependency tree ($flags):"; echo "$out"; exit 1
            fi
            case "$out" in *"did not match any packages"*) ;; *) echo "unexpected cargo tree failure ($flags): $out"; exit 1 ;; esac
          done
  
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, security-audit]
    # Builds on every event, pull requests included, so a broken Dockerfile fails the PR. It holds no
    # secret and pushes nothing (CireSnave 2026-10-22: no repository secrets in pull-request jobs);
    # `publish-docker` below logs in and pushes, on push events only.
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/thinkersjournal/synapse
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      
      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-docker:
    name: Publish Docker Image (push only)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/thinkersjournal/synapse
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: publish-docker
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Deploy to staging environment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/synapse
            docker-compose pull
            docker-compose up -d
  
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: publish-docker
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Deploy to production environment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/synapse
            docker-compose pull
            docker-compose up -d

  # Advisory portfolio check (CireSnave 2026-10-23: "Roll out advisory-only, non-blocking CodeRipper
  # checks everywhere."). NOT a required check and no rule is silenced here; the PM gate reads it as
  # advice. Pinned to a commit of the reusable workflow, which this repo (public) runs on hosted runners.
  portfolio:
    name: CodeRipper portfolio (advisory)
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@b45eb41f43e7de585239b28250e2ab62e612970d
