# REMOVED 2026-09-10: examples/multi_transport_circuit_breaker_demo.rs imported
# EnhancedTcpTransport and EmailEnhancedTransport, whose modules are commented out in
# src/transport/mod.rs:55 and :65 ("Temporarily disabled due to compilation issues").
# `cargo test` builds examples and `cargo build` does not, so this one example kept the
# entire test suite from ever running in CI -- 102 tests that pass locally had never
# executed there. Measured before deciding: tcp_enhanced.rs COMPILES CLEANLY today (the
# comment is stale for it), email_enhanced.rs still has 7 real errors against the current
# TransportMetrics. Restoring the example therefore needs a decision about the email
# transport, not a typo fix. Recoverable with `git show <ref>:examples/...`.

# ---------------------------------------------------------------------------
# One integration test is excluded from `cargo test` with `test = false`.
#
# `comprehensive_feature_test` does not compile, and not because of a typo: it targets
# an API this crate no longer has. It still refers to `EmrpRouter` -- the pre-rename
# name, from before EMRP became Synapse in v1.1.0 -- plus `SimpleMessage`,
# `MessageType`, `Config::gmail`, `Config::for_entity` and ~12 `ParticipantProfile`
# fields that do not exist (137 errors).
#
# `cargo test` builds every test target, so it kept the tests that DO pass from ever
# running in CI. Excluding it is not a judgement that it is worthless -- it encodes
# intent about a participant/trust API -- but repairing it means deciding what that
# API should be, which is a merge decision and not a repair. It stays in the tree,
# compile-checked by nothing, and is listed as aspirational in CAPABILITY_INVENTORY.md.
#
# `end_to_end_integration_test` was deleted in rc.92 on the same grounds: it imported
# `synapse::identity::{Identity, KeyPair}`, `synapse::services::trust_manager` and
# `Database::new_in_memory`, none of which resolve, and it used
# `UnifiedTransportManager::new_with_transports` and `TrustManager::trust_participant`,
# which do not exist. Nothing else referenced it. `git show bec9ea5:tests/end_to_end_integration_test.rs`
# recovers it.
[[test]]
name = "comprehensive_feature_test"
path = "tests/comprehensive_feature_test.rs"
test = false

[[bench]]
name = "mailbox_depth_cost"
harness = false
required-features = ["mailbox-redb"]

[[bench]]
name = "mailbox_fetch_cost"
harness = false
required-features = ["mailbox-redb"]

[[test]]
name = "jwt_backend"
path = "tests/jwt_backend.rs"
required-features = ["jwt"]

[features]
default = ["native"]

# Standard library support
std = []

# Minimal feature set for basic functionality
minimal = [
    "dep:tokio",
    "dep:rand",
    "dep:dashmap",
    "telemetry",
    "dep:toml",
    "dep:base64",
    "dep:sha2",
]

# Core functionality (minimal dependencies)
core = [
    "minimal",
    "crypto",
    "dep:clap",
    "dep:regex",
    "dep:pem",
    "dep:bcrypt",
    "dep:hex",
]

# Feature definitions for subsystems and implementations
crypto = [
    "dep:ring",
    "dep:hpke",
    "dep:aes-gcm",
    "dep:sha2",
    "dep:ed25519-dalek",
    "dep:base64",
]
http = [
    "dep:reqwest",
    "dep:tokio-tungstenite",
    "dep:axum",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower",
    "dep:tower-http",
    "dep:http-body-util",
]
mdns = ["dep:auto-discovery", "dep:socket2"] # Using auto-discovery crate now
auto_discovery = ["dep:auto-discovery", "mdns"]
telemetry = ["dep:tracing-subscriber"]

# Durable mailbox store on redb (M4 PR2).
mailbox-redb = ["dep:redb"]

# The mailbox conformance suite as a public module (`synapse::mailbox::conformance`), so a
# `MailStore` in another crate can be proved against the same cases. Off by default.
mailbox-conformance = ["dep:tempfile"]

# Networking feature (adds network transport capabilities)
networking = ["core", "http", "mdns", "dep:futures-util"]

# NAT traversal feature (adds real NAT traversal capabilities)
nat_traversal = [
    "core",
]

# Email feature (adds email server capabilities). async-imap and lettre are regular, non-optional
# dependencies now (see their Cargo.toml comments), so they are not listed with `dep:` here.
email = [
    "core",
    "dep:mail-parser",
    "dep:native-tls",
    "dep:tokio-rustls",
]

# JWT support. Only tests/jwt_backend.rs uses it. Kept out of `core` and `native-base` so the client
# crates (`synapsed-client` depends on `native-base`) do not carry jsonwebtoken at all.
jwt = ["dep:jsonwebtoken"]

# Full native platform support (the original working config but with updated deps)
native = ["native-base", "jwt"]

# `native` without `jwt`. Database, cache and auth features were retired in rc.83 (board 199, 200).
native-base = [
    "core",
    "mailbox-redb",
    "networking",
    "nat_traversal",
    "email",
    "crypto",
    "http",
    "mdns",
    "telemetry",
]

# WASM feature for browser environments
wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
    "dep:gloo-utils",
    "dep:gloo-storage",
    "dep:console_error_panic_hook",
    "dep:wasm-logger",
    "dep:getrandom",
]

# No cdylib: on Windows it and the `synapse` CLI binary both emit synapse.pdb (cargo#6313).
# The root wasm-pack path it served is unmeasured and not working (CAPABILITY_INVENTORY 5.4);
# the planned WASM slice builds its own `wasm/` crate, which will declare cdylib itself.
[lib]
crate-type = ["rlib"]

[package.metadata.wasm-pack.profile.release]
wee_alloc = false
