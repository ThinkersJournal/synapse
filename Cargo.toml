[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "6.0.0-rc.177"

[package]
name = "synapse"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "Neural Communication Network with Federated Identity"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/synapse"
homepage = "https://github.com/ThinkersJournal/synapse"
documentation = "https://docs.rs/synapse"
readme = "README.md"
keywords = ["neural", "communication", "ai", "federated", "identity"]
categories = [
    "network-programming",
    "web-programming",
    "cryptography",
    "science",
    "wasm",
]
exclude = [
    "*.md",
    "docs/",
    "examples/README*.md",
    "target/",
    ".git/",
    ".vscode/",
    "*.bat",
    "*.sh",
]

[dependencies]
# Core dependencies - always included
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive", "std"] }
serde_json = { version = "1.0", features = ["std"] }
proc-macro2 = "1.0"
quote = "1.0"
tokio = { version = "1.46.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "fs",
    "io-util",
    "io-std",
    "signal",
], optional = true }
dashmap = { version = "6.0", optional = true }
rand = { version = "0.10.3", optional = true }
auto-discovery = { version = "0.3.3", optional = true, default-features = false, features = ["mdns-sd"] }

# Auth framework dependencies
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
semver = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = { version = "0.1", features = ["std", "attributes"] }
url = "2.0"

# Cryptography
# `std` makes ring's errors `std::error::Error`; src/synapse/auth/utils.rs converts them with `?` into
# anyhow. It used to be switched on by another crate's graph, which auth-framework 0.5 no longer has.
ring = { version = "0.17", optional = true, features = ["std"] }
# Sealing (P2 slice d): HPKE base mode, X25519 + HKDF-SHA256 + ChaCha20-Poly1305.
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"], optional = true }
aes-gcm = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
ed25519-dalek = { version = "3.0.0", optional = true, features = ["pkcs8", "pem"] }
base64 = { version = "0.23", optional = true }

# Configuration - optional
toml = { version = "0.9.2", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
clap = { version = "4.5.41", features = ["derive"], optional = true }

# Networking - optional
reqwest = { version = "0.13.5", features = ["json"], optional = true }
# The HTTP transport's server (src/transport/http_unified.rs), under the `http` feature.
axum = { version = "0.8.9", default-features = false, optional = true }
hyper = { version = "1.11.1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1.20", features = ["tokio"], optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tower-http = { version = "0.7.1", features = ["limit"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
tokio-tungstenite = { version = "0.30.0", optional = true }
futures-util = { version = "0.3", optional = true }

# NAT traversal dependencies for real implementation

# System monitoring - optional

# Email protocols
# Regular (non-optional) dependency, not gated behind the `email` feature: every other
# `TransportType` in this crate is unconditionally compiled, and email should not be the one
# exception requiring a non-default build flag to exist at all (task-3-brief.md, plan decision).
# `default-features = false` + `runtime-tokio`: this crate is built on tokio throughout, never
# async-std (async-imap's own default runtime).
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
# `tokio1` with lettre's default `native-tls` is a compile_error unless `tokio1-native-tls` is on too.
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
mail-parser = { version = "0.11", optional = true }
tokio-rustls = { version = "0.26", optional = true }
native-tls = { version = "0.2", optional = true }

# Only the conformance suite needs a temp directory at run time (a keystore per case).
tempfile = { version = "3.0", optional = true }


# Missing dependencies that are needed
regex = { version = "1.10", optional = true }
# From 10.x jsonwebtoken ships no crypto by default and PANICS at first use without a
# backend (tests/jwt_backend.rs). aws_lc_rs: already in the tree via rustls, and unlike
# rust_crypto it does not pull `rsa` (RUSTSEC-2023-0071, no fix).
jsonwebtoken = { version = "11.1.0", optional = true, default-features = false, features = ["use_pem", "aws_lc_rs"] }
pem = { version = "4.0", optional = true }
bcrypt = { version = "0.15", optional = true }
hex = { version = "0.4", optional = true }

# Network discovery - uses auto-discovery crate
socket2 = { version = "0.6.0", optional = true } # Used for other network operations

# WASM-specific dependencies
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    "BroadcastChannel",
], optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.4.3", optional = true }
gloo-utils = { version = "0.3.0", optional = true }
gloo-storage = { version = "0.4.0", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-logger = { version = "0.2", optional = true }
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

# Development dependencies
# Durable mailbox store (M4 PR2). D1, CireSnave: "Redb is fine for now."
redb = { version = "4.4.0", optional = true }

# Windows ACL check for the keystore (M2, spec 4 Q2(a)).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Turns the conformance feature on for this crate's own tests, so `cargo test` runs the suite
# against MemoryStore and RedbStore without a flag. No version: dev-dependencies without one are
# dropped on publish.
synapse = { path = ".", package = "synapse", features = ["mailbox-conformance"] }
tokio-test = "0.4"
pretty_assertions = "1.0"

# WASM-specific dev dependencies
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

